function render(){$('#identity').innerHTML='<span class="person-avatar">'+esc(operatorName?operatorName.slice(-2):'运营')+'</span><span class="person-label"><strong>'+esc(operatorName||'设置姓名')+'</strong><small>运营 · 连接设置</small></span>';const pending=tasks.filter(t=>t.state===3).length;$('#nav').innerHTML=[['all','我的需求'],['confirm','待我确认'],['done','已完结'],['notice','消息提醒']].map(([v,n])=>`<button class="${view===v?'active':''}" onclick="navigate('${v}')">${n}${v==='confirm'?'<span class="badge">'+pending+'</span>':''}</button>`).join('');let title={all:'我的需求',confirm:'待我确认',done:'已完结',notice:'消息提醒'}[view];$('#main').innerHTML=`<div class="top"><span>运营工作台 / ${title}</span><div class="nas-tools"><span id="nas-status" class="pill"></span><button class="refresh-nas" aria-label="刷新 NAS" title="刷新 NAS" onclick="refreshNas()">↻</button></div></div><div class="heading"><div><div class="eyebrow">OPERATIONS WORKSPACE</div><h1>${title}</h1><p>需求有进度，确认有记录。</p></div></div>`;
paintNasStatus();if(view==='all')$('#main').innerHTML+=uploadPanel();

$('#main').innerHTML+=`<div class="summary"><button class="metric" onclick="operatorSummary(3)"><span>待我确认</span><b>${pending}<small>项</small></b></button><button class="metric" onclick="operatorSummary(-1)"><span>制作与排期中</span><b>${tasks.filter(t=>t.state<3).length}<small>项</small></b></button><button class="metric" onclick="operatorSummary(4)"><span>已完成</span><b>${tasks.filter(t=>t.state===4).length}<small>项</small></b></button></div>${view==='confirm'?'<div class="note">在钉钉确认稿件后记录结果。确认完成后，需求进入已完结，由设计师上传封存。</div>':''}<div class="tools"><button class="refresh-cards" onclick="refreshCards(this)">↻ 刷新卡片状态</button><div class="tabs">${['all',0,1,2,3,4].filter(v=>view==='all'||v==='all').map(v=>`<button class="${String(filter)===String(v)?'active':''}" onclick="filter='${v}';render()">${v==='all'?'全部':labels[v]}</button>`).join('')}</div><input class="search" aria-label="搜索需求" placeholder="搜索任务、产品或69码" value="${esc(query)}" oninput="query=this.value;drawCards()"></div><div id="cards"></div>`;drawCards()}
function operatorSummary(state){const list=tasks.filter(t=>state===-1?t.state<3:t.state===state);modal(state===-1?'制作与排期中':state===3?'待我确认':'已完成',list.length?list.map(t=>'<button class="drill-row" onclick="detail('+t.id+')"><span><strong>'+esc(t.title)+'</strong><small style="color:'+colors[t.state][0]+'">'+labels[t.state]+' · '+esc(t.designer)+'</small></span><span>查看详情 ›</span></button>').join(''):'<div class="empty">暂无对应需求</div>',true)}

function acceptNative(s){if(!s)return;currentSettings=s.settings;operatorName=s.settings.name;tasks=s.tasks.map(t=>({...t,time:new Date(t.time).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}));loaded=true;lastCheckedAt=s.checkedAt||null;connectionError='';$('#identity').innerHTML='<span class="person-avatar">'+esc(operatorName?operatorName.slice(-2):'运营')+'</span><span class="person-label"><strong>'+esc(operatorName||'设置姓名')+'</strong><small>运营 · 连接设置</small></span>';if(!$('#modal').open&&document.activeElement?.tagName!=='INPUT')render();paintNasStatus();if(s.issues?.length){const note=document.createElement('div');note.className='note';note.textContent=s.issues.length+' 份表无法读取，请在连接设置查看具体原因。';$('#main').prepend(note)}window.lastIssues=s.issues||[]}
function editIdentity(){modal('连接与姓名设置','<label>运营姓名</label><input id="operator-name" class="field" value="'+esc(operatorName)+'"><label>NAS 任务对接库</label><input id="nas-root" class="field" value="'+esc(currentSettings.root)+'"><p>关闭窗口后继续在系统托盘运行；彻底退出请右键托盘图标选择“退出软件”。<br>通过 Windows 已登录的 NAS 账号访问。仅显示表内运营姓名与你一致的需求。</p>'+(window.lastIssues||[]).map(i=>'<div class="note">'+esc(i.stage+' / '+i.file)+'<br>'+esc(i.message)+'</div>').join('')+'<div class="actions"><button id="connect-button" class="primary" onclick="saveIdentity()">保存并连接</button></div>')}
async function saveIdentity(){const button=$('#connect-button');if(button.disabled)return;button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='正在连接…';toast('正在检查 NAS 并读取需求，首次读取可能较慢，请稍候。');try{const result=await nativeCall('configure',{name:$('#operator-name').value,root:$('#nas-root').value});$('#modal').close();acceptNative(result);toast('连接成功')}catch(e){toast('连接未完成：'+e.message)}finally{button.disabled=false;button.removeAttribute('aria-busy');button.textContent='保存并连接'}}
function uploadPanel(){return '<button id="dropzone" class="dropzone" '+(uploading?'disabled aria-busy="true"':'')+' onclick="upload()" ondragover="event.preventDefault();this.classList.add(&quot;dragging&quot;)" ondragleave="this.classList.remove(&quot;dragging&quot;)" ondrop="dropRequirements(event)"><strong>'+(uploading?'正在检查并上传…':'把 Excel 需求表拖到这里')+'</strong><small>拖入即可上传到待分配，也可以点击选择 · 支持多份 .xlsx</small></button><div id="upload-results" role="status">'+uploadResults.map(r=>'<div class="upload-result '+(r.error?'error':'')+'"><strong>'+esc(r.name)+'</strong><div>'+esc(r.message)+'</div>'+(r.reasons?.length?'<ul>'+r.reasons.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'</div>').join('')+'</div>'}
function redrawUpload(){const zone=$('#dropzone');if(zone){const temp=document.createElement('div');temp.innerHTML=uploadPanel();$('#upload-results')?.remove();zone.replaceWith(...temp.childNodes)}}
async function dropRequirements(event){event.preventDefault();event.currentTarget.classList.remove('dragging');if(uploading)return;const files=Array.from(event.dataTransfer.files);await uploadFiles(files)}
function upload(){if(uploading)return;const input=document.createElement('input');input.type='file';input.accept='.xlsx';input.multiple=true;input.onchange=()=>uploadFiles(Array.from(input.files));input.click()}
async function uploadFiles(files){if(uploading||!files.length)return;uploading=true;uploadResults=[];redrawUpload();try{for(const file of files){try{if(!/\.xlsx$/i.test(file.name))throw Error('仅支持 .xlsx 需求表，请勿拖入文件夹、图片或旧版 .xls');const result=await nativeCall('submitFile',{path:window.operatorApi.filePath(file)});acceptNative(result);uploadResults.push({name:file.name,message:'上传成功，已进入 1.待分配'});}catch(e){uploadResults.push({name:file.name,error:true,message:e.message,reasons:e.reasons||[]})}redrawUpload()}}finally{uploading=false;redrawUpload()}}

function detail(id){const t=tasks.find(t=>t.id===id);if(!t)return;modal(t.title,rows(t)+(t.ratings?'<h3>交付评价</h3>'+t.items.map(i=>'<div class="row"><span>'+esc(i.typeName)+'</span><b>'+esc(t.ratings.quality.find(r=>r.row===i.row)?.value||'未评分')+'</b></div>').join('')+'<div class="row"><span>时效满意度</span><b>'+esc(t.ratings.timeliness||'未评价')+'</b></div>':'')+[['需求提出',t.requestedAt],['分配时间',t.templateTimes.assignedAt],['开始设计',t.templateTimes.startedAt],['提交确认',t.templateTimes.reviewAt],['确认完成',t.templateTimes.completedAt]].map(([k,v])=>'<div class="row"><span>'+k+'</span><b>'+(v?new Date(v).toLocaleString('zh-CN'):'—')+'</b></div>').join('')+'<div class="note">'+esc(t.filename)+'</div><div class="actions">'+([0,3,4].includes(t.state)?'<button onclick="openOriginal('+id+')">打开原需求表编辑</button>':'<span>此阶段只读</span>')+([0,1,2,3].includes(t.state)?'<button onclick="editCode('+id+')">更正69码</button>':'')+(t.state===3?'<button class="primary" onclick="confirmTask('+id+')">处理确认</button>':'')+'</div>',true)}
async function openOriginal(id){try{await nativeCall('open',{id});toast('已打开原表，编辑后请保存并关闭 Excel')}catch(e){toast(e.message)}}
function editCode(id){const t=tasks.find(task=>task.id===id);if(!t||![0,1,2,3].includes(t.state))return;modal('更正产品69码','<p>'+esc(t.title)+'</p><div class="row"><span>当前69码</span><b>'+esc(t.code)+'</b></div><label for="corrected-code">正确的产品69码</label><input id="corrected-code" class="field" type="text" inputmode="numeric" maxlength="13" autocomplete="off" value="'+esc(t.code)+'"><div class="note">保存后工作台将同步正确的产品69码，任务可在当前环节继续流转。</div><div class="actions"><button onclick="detail('+id+')">取消</button><button id="correct-code-button" class="primary" onclick="saveCode('+id+','+JSON.stringify(t.sourceHash).replace(/"/g,'&quot;')+')">保存更正</button></div>',true);$('#corrected-code').focus();$('#corrected-code').select()}
async function saveCode(id,expectedHash){const button=$('#correct-code-button');if(!button||button.disabled)return;const code=$('#corrected-code').value.trim();if(!/^69\d{11}$/.test(code)){toast('请填写69开头的13位产品69码');return}button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='正在备份并更正…';try{const result=await nativeCall('correctCode',{id,code,expectedHash});$('#modal').close();acceptNative(result);toast('69码已更正，负责人工作台同步后可继续流转')}catch(e){toast(e.message)}finally{if(button.isConnected){button.disabled=false;button.removeAttribute('aria-busy');button.textContent='保存更正'}}}
function ratingForm(t){return '<h3>质量评分</h3>'+t.items.map(i=>'<fieldset class="rating"><legend>'+esc(i.typeName)+' · '+i.qty+'</legend>'+[60,80,100].map(v=>'<label><input type="radio" name="quality-'+i.row+'" value="'+v+'">'+v+' 分</label>').join('')+'</fieldset>').join('')+'<fieldset class="rating"><legend>整体时效满意度</legend>'+['满意','不满'].map(v=>'<label><input type="radio" name="timeliness" value="'+v+'">'+v+'</label>').join('')+'</fieldset>';}
function confirmTask(id){modal('确认完成并流转','<p>'+esc(tasks.find(t=>t.id===id).title)+'</p>'+ratingForm(tasks.find(t=>t.id===id))+'<div class="note">点击确认时自动记录当前日期和小时段，需求流转到5.已完结，设计师随后可上传封存。</div><label class="check"><input id="approved" type="checkbox" onchange="document.getElementById(&quot;approve&quot;).disabled=!this.checked">已在钉钉确认最终稿</label><div class="actions"><button id="approve" class="primary" disabled onclick="approve('+id+')">确认完成并流转</button></div>')}

async function approve(id){const button=$('#approve');button.disabled=true;button.textContent='正在备份并流转…';try{const result=await nativeCall('approve',{id,ratings:{quality:tasks.find(t=>t.id===id).items.map(i=>({row:i.row,value:Number(document.querySelector('input[name=quality-'+i.row+']:checked')?.value)})),timeliness:document.querySelector('input[name=timeliness]:checked')?.value}});$('#modal').close();acceptNative(result);toast('已流转到5.已完结')}catch(e){toast(e.message);button.disabled=false;button.textContent='重新尝试流转'}}
async function refreshCards(button){if(button.disabled)return;button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='正在刷新状态…';try{acceptNative(await nativeCall('scan'));toast('卡片状态已刷新')}catch(e){connectionError=e.message;paintNasStatus();toast('刷新失败：'+e.message)}finally{button.disabled=false;button.removeAttribute('aria-busy');button.textContent='↻ 刷新卡片状态'}}
function paintNasStatus(){const header=$('#header-nas');if(header){const ok=!!lastCheckedAt&&!connectionError;header.innerHTML='<span class="nas-dot '+(ok?'online':operatorName&&!connectionError?'connecting':'')+'"></span>'+esc(connectionError?'NAS 同步失败':ok?'NAS 直连':operatorName?'NAS 连接中…':'NAS 未连接');header.title=connectionError||'';}const el=$('#nas-status');if(!el)return;const online=!!lastCheckedAt&&!connectionError;el.innerHTML='<span class="nas-dot '+(online?'online':'')+'"></span><span>'+esc(connectionError?'NAS 同步失败':online?'同步于 '+new Date(lastCheckedAt).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):operatorName?'正在连接 NAS…':'NAS 未连接')+'</span>';el.title=connectionError||'每15秒自动检查 NAS';}
async function refreshNas(){const b=$('.refresh-nas');if(b){b.disabled=true;b.setAttribute('aria-busy','true');b.textContent=''}try{acceptNative(await nativeCall('scan'))}catch(e){connectionError=e.message;paintNasStatus();toast(e.message)}finally{if(b){b.disabled=false;b.removeAttribute('aria-busy');b.textContent='↻'}}}
window.operatorApi.onChange(acceptNative);window.operatorApi.onError(message=>{connectionError=message;paintNasStatus()});
render();nativeCall('scan').then(s=>{acceptNative(s);if(!operatorName)editIdentity()}).catch(e=>{toast(e.message);editIdentity()});

</script><script src="../assets/ui-select.js"></script></html>
